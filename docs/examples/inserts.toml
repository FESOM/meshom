# Curvilinear inserts: a finer structured patch fitted into a mesh that is already built (decisions B158-B169,
# B180-B206). Nothing here runs by default: `meshom run` never makes an insert; an insert is made only by the command
# below, on any finished run (meshom's own meshes, triangle meshes, ORCA grids).
#
# 1. Build or pick a finished run folder (`meshom run CONFIG`; `--mesh NAME` picks another mesh of the folder).
# 2. Write one [[inserts]] entry per place (this file, or the [[inserts]] tables of a run config):
#    - a strait: `strait` = a name of the built-in list (or of the run's [[straits]]), or `path` = the centreline
#      [[lon, lat], ...] from one basin to the other; `cells` across the narrowest section or `h_fine_m`;
#    - a coastal strip (experimental): `kind = "strip"`, `path` = points along the coast, `width_km` = from the
#      coast out to where the insert meets the mesh, `h_fine_m` = the cell size at the coast;
#    - a current corridor in open water (experimental): `kind = "corridor"`, `path` = the axis, `width_km` = the full
#      width, `h_fine_m` (see inserts_gulf_stream.toml).
# 3. Run it on a compute node:
#        python -m meshom.insert --run RUN_DIR --config docs/examples/inserts.toml [--out DIR]
#    or one entry inline: python -m meshom.insert --run RUN_DIR --insert 'name=gib; strait=Gibraltar; cells=10'
# 4. Read the result: exit code 0 when every entry was built, 2 when one was refused. Per entry: insert_<name>.json
#    (valid or refused, the reason and the fix it suggests, the quality of the insert and of the cells round it),
#    insert_<name>.map.png (the host, the result and zooms), and fesom-insert_<name>/ (the model files of the
#    whole mesh) when the run wrote model files.
# 5. A refusal names the rule and the value that would pass: most often the size floor `h_min_m` (default: the host
#    mesh's smallest cell; set it lower to allow finer cells), the number of cells, or the width.
#
# Bays of the real coast get cells of their own when their mouth holds 3 insert cells (`bays = "auto"`); smaller ones
# are closed by a smooth line across the mouth. Round the joins the host cells are cleaned on meshom's own meshes
# (`collar_rings`, default 10); on an ORCA host every host node stays where it is.

[[inserts]]
name = "gibraltar"
strait = "Gibraltar"
cells = 10

# Fitted to an ORCA host side by side: 6 cells across the neck, a near join with 6 host edges on the side where the
# strait opens fast (a fast transition there), 9 host edges on the other side, the banks free to move up to one local
# cell into land (smoother banks, squared ends at the joins).
[[inserts]]
name = "gibraltar_fitted"
strait = "Gibraltar"
cells = 6
cells_a = 6
growth_a = 0.3
cells_b = 9
growth_b = 0.15
bank_land_cells = 1.0

# Fill lines: the Bay of Seine and the Thames estuary cut off the main block by two drawn lines, so its columns are not
# stretched over them; the water behind each line is meshed as a strip of its own hanging off that bank.
[[inserts]]
name = "dover_filled"
path = [[-1.9, 50.15], [-0.6, 50.35], [0.7, 50.65], [1.45, 51.0], [2.1, 51.45], [2.9, 51.95], [3.2, 52.6]]
cells = 5
reach_km = 450.0
cells_a = 6
cells_b = 11
bank_land_cells = 1.0
fill = [[[-1.25, 49.60], [-0.5, 49.65], [0.0, 49.72], [0.3, 49.77], [0.5, 49.88], [1.0, 49.90], [1.3, 50.05], [1.6, 50.18]],
        [[1.05, 51.42], [1.25, 51.55], [1.45, 51.68], [1.50, 51.85], [1.50, 52.10]]]

[[inserts]]
name = "denmark"
path = [[-31.0, 64.5], [-22.0, 67.5]]
cells = 12

[[inserts]]
name = "portugal"
kind = "strip"
path = [[-8.95, 37.3], [-8.9, 37.95], [-9.0, 38.45], [-9.55, 38.75], [-9.45, 39.4], [-8.95, 40.2], [-8.8, 41.1],
        [-8.95, 41.8]]
width_km = 50.0
h_fine_m = 2500.0
h_min_m = 1000.0
